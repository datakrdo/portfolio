version: 2

models:
  - name: stg_dengue_zika__legacy
    description: >
      Dengue/Zika notifications, legacy schema era (2018-2022). Stays 1:1 with the
      source files (no dedup across revisions). Rows with a null epi week are
      dropped here on purpose: they are footer/metadata rows some files end with,
      not data (see docs/data_profile.md). Dropping them is the only filter applied.
    columns:
      - name: year
        tests:
          - not_null
      - name: epi_week
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 53
      - name: event
        tests:
          - not_null
      - name: _source_file
        tests:
          - not_null

  - name: stg_dengue_zika__current
    description: >
      Dengue/Zika notifications, current schema era (2023+). Stays 1:1 with the
      source files, so a period republished several times appears once per file.
      Rows with a null epi week are dropped here on purpose: they are footer/metadata
      rows some files end with, not data (see docs/data_profile.md).
    columns:
      - name: year
        tests:
          - not_null
      - name: epi_week
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 53
      - name: event
        tests:
          - not_null
      - name: _source_file
        tests:
          - not_null

  - name: stg_renaper_population
    description: >
      RENAPER identified population by department, one row per published cut
      (publish_date) and department. The sex/age/nationality breakdown of the source
      is summed away here.
    columns:
      - name: publish_date
        tests:
          - not_null
      - name: department_id
        tests:
          - not_null
      - name: population
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [publish_date, province_id, department_id, department_name]
