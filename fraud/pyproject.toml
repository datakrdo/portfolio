[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "2026.1.0"
description = "Credit card fraud detection: production pipeline and portfolio notebook"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Krdo" }]
dependencies = [
    "numpy>=2.4",
    "pandas>=2.2",
    "scikit-learn>=1.7",
    "scipy>=1.15",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
]

[project.optional-dependencies]
gpu = ["xgboost>=2.1", "lightgbm>=4.5"]
hpo = ["optuna>=4.1"]
shap = ["shap>=0.46"]
imb = ["imbalanced-learn>=0.13"]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
all = [
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=4.1",
    "shap>=0.46",
    "imbalanced-learn>=0.13",
    "pytest>=8.3",
    "ruff>=0.15",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[project.scripts]
fraud = "src.fraud.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".clinerules", ".claude", ".cline", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
