[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "fraud-detection"
version = "2026.1.0"
description = "Credit card fraud detection: production pipeline and portfolio notebook"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Krdo" }]
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "joblib>=1.4",
]

[project.optional-dependencies]
gpu = ["xgboost>=3.4", "lightgbm>=4.7"]
shap = ["shap>=0.52"]
imb = ["imbalanced-learn>=0.14"]
all = ["fraud-detection[gpu,shap,imb]"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16.9",
    "nbconvert>=7.17",
    "nbformat>=5.11",
    "jupyter>=1.1",
    "ipykernel>=7",
    "ipywidgets>=8.1",
]

[project.scripts]
fraud = "fraud.cli:main"

[tool.uv.build-backend]
module-name = "fraud"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".clinerules", ".claude", ".cline", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
