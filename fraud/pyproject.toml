[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "2026.1.0"
description = "Credit card fraud detection: production pipeline and portfolio notebook"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Krdo" }]
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "joblib>=1.4",
]

[project.optional-dependencies]
gpu = ["xgboost>=3.4", "lightgbm>=4.7"]
hpo = ["optuna>=5.0"]
shap = ["shap>=0.52"]
imb = ["imbalanced-learn>=0.14"]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "nbconvert>=7.17",
    "nbformat>=5.11",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
all = [
    "xgboost>=3.4",
    "lightgbm>=4.7",
    "optuna>=5.0",
    "shap>=0.52",
    "imbalanced-learn>=0.14",
    "pytest>=9.1",
    "ruff>=0.16",
    "nbconvert>=7.17",
    "nbformat>=5.11",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[project.scripts]
fraud = "src.fraud.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".clinerules", ".claude", ".cline", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
