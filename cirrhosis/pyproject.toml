[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbc-modeling"
version = "2026.1.0"
description = "PBC cirrhosis stage prediction: production pipeline and portfolio notebook"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Federico Dignani" }]
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "seaborn>=0.13",
]

[project.optional-dependencies]
shap = ["shap>=0.52"]
optuna = ["optuna>=5.0"]
lgbm = ["lightgbm>=4.7"]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=1.13",
    "nbconvert>=7.17",
    "nbformat>=5.11",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]
all = [
    "shap>=0.52",
    "optuna>=5.0",
    "lightgbm>=4.7",
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=1.13",
    "nbconvert>=7.17",
    "nbformat>=5.11",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[project.scripts]
pbc-pipeline = "scripts.run_pipeline:main"
pbc-eda = "scripts.run_eda:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".clinerules", ".claude", ".cline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebooks resolve PROJECT_ROOT and extend sys.path before importing from src,
# all in one leading cell -- E402 is a structural necessity here, not a smell.
"notebooks/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]
