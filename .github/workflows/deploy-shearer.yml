name: Deploy Shearer dashboard

on:
  push:
    branches: [main]
    paths:
      - "shearer/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shearer
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: shearer

      - name: Install shearer from GitHub (so shinyapps.io can rebuild it server-side)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'remotes::install_github("${{ github.repository }}", subdir = "shearer", upgrade = "never")'

      - name: Configure rsconnect account
        run: |
          Rscript -e '
          rsconnect::setAccountInfo(
            name   = "${{ secrets.SHINYAPPS_NAME }}",
            token  = "${{ secrets.SHINYAPPS_TOKEN }}",
            secret = "${{ secrets.SHINYAPPS_SECRET }}"
          )'

      - name: Deploy to shinyapps.io
        run: Rscript deploy.R
