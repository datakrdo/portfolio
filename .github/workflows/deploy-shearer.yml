name: Deploy Shearer dashboard

on:
  push:
    branches: [main]
    paths:
      - "shearer/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shearer
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: shearer
          extra-packages: |
            any::rsconnect
            any::remotes
            any::bslib
            any::shiny
            any::plotly
            any::reactable
            any::thematic

      # RSPM binaries tag installed packages with Repository: RSPM, and
      # shinyapps.io's server can't resolve that when it needs to rebuild a
      # package from source (it treats "RSPM" as a literal URL). The
      # packages are identical either way, so just relabel them as CRAN,
      # which the server does handle correctly.
      - name: Relabel RSPM packages as CRAN so shinyapps.io can rebuild them
        run: Rscript ../.github/scripts/relabel-rspm-as-cran.R

      - name: Install shearer from GitHub (so shinyapps.io can rebuild it server-side)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'remotes::install_github("${{ github.repository }}", subdir = "shearer", upgrade = "never")'

      - name: Configure rsconnect account
        run: |
          Rscript -e '
          rsconnect::setAccountInfo(
            name   = "${{ secrets.SHINYAPPS_NAME }}",
            token  = "${{ secrets.SHINYAPPS_TOKEN }}",
            secret = "${{ secrets.SHINYAPPS_SECRET }}"
          )'

      - name: Deploy to shinyapps.io
        run: Rscript deploy.R
