name: Deploy Shearer dashboard

on:
  push:
    branches: [main]
    paths:
      - "shearer/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shearer
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install shearer and app dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: shearer
          extra-packages: |
            any::rsconnect
            any::remotes
            any::bslib
            any::shiny
            any::plotly
            any::reactable
            any::thematic
          needs: check

      - name: Install shearer from GitHub (so shinyapps.io can rebuild it server-side)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'remotes::install_github("${{ github.repository }}", subdir = "shearer", upgrade = "never")'

      - name: Configure rsconnect account
        run: |
          Rscript -e '
          rsconnect::setAccountInfo(
            name   = "${{ secrets.SHINYAPPS_NAME }}",
            token  = "${{ secrets.SHINYAPPS_TOKEN }}",
            secret = "${{ secrets.SHINYAPPS_SECRET }}"
          )'

      - name: Deploy to shinyapps.io
        run: Rscript deploy.R
